<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart | roxxx.shop</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="cart.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="cart-header">
    <a href="index.html" class="back-button" aria-label="Go back">
      ←
    </a>

    <h1>My Cart</h1>

    <div class="header-spacer"></div>
  </header>


  <!-- =========================
       MAIN CART
  ========================== -->

  <main class="cart-container">

    <!-- Cart items will be inserted here by cart.js -->
    <section id="cartItems" class="cart-items"></section>


    <!-- =========================
         ORDER SUMMARY
    ========================== -->

    <section id="orderSummary" class="order-summary">

      <h2>Order Summary</h2>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">৳0</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span id="delivery">৳60</span>
      </div>

      <div class="summary-divider"></div>

      <div class="summary-row total-row">
        <span>Total</span>
        <span id="total">৳0</span>
      </div>

      <button id="checkoutBtn" class="checkout-button">
        Proceed to Checkout
      </button>

    </section>

  </main>


  <!-- =========================
       EMPTY CART
  ========================== -->

  <section id="emptyCart" class="empty-cart hidden">

    <div class="empty-cart-icon">
      🛒
    </div>

    <h2>Your cart is empty</h2>

    <p>
      Looks like you haven't added anything to your cart yet.
    </p>

    <a href="index.html" class="continue-shopping">
      Continue Shopping
    </a>

  </section>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <a href="index.html">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a href="#" onclick="showComingSoon(event)">
      <span>🚚</span>
      <small>Delivery</small>
    </a>

    <a href="cart.html" class="active">
      <span>🛒</span>
      <small>Cart</small>
    </a>

    <a href="#" onclick="showComingSoon(event)">
      <span>⌕</span>
      <small>Search</small>
    </a>

    <a href="#" onclick="showComingSoon(event)">
      <span>♙</span>
      <small>Account</small>
    </a>

  </nav>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="cart.js"></script>

</body>
</html>
