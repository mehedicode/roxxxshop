<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Shop All Products - roxxx.shop</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: "var(--color-bg)",
              dark: "var(--color-dark)",
              primary: "var(--color-primary)",
              hover: "var(--color-primary-hover)",
              accent: "var(--color-accent)",
              text: "var(--color-text)",
              muted: "var(--color-muted)",
              border: "var(--color-border)"
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="shop.css">
</head>

<body>

  <!-- HEADER -->

  <header class="shop-header">

    <div class="header-inner">

      <a href="index.html" class="brand">
        roxxx<span>.shop</span>
      </a>

      <a href="cart.html" class="header-cart" aria-label="Cart">

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="9" cy="20" r="1"/>
          <circle cx="19" cy="20" r="1"/>
          <path d="M3 4h2l2.6 11.2a2 2 0 0 0 2 1.55h7.8a2 2 0 0 0 1.9-1.37L21 8H6"/>
        </svg>

        <span id="cartBadge" class="cart-badge">0</span>

      </a>

    </div>

  </header>


  <!-- MAIN -->

  <main class="shop-container">

    <!-- PAGE TITLE -->

    <section class="shop-title">

      <div>

        <p class="eyebrow">
          ROXXX.SHOP
        </p>

        <h1>
          All Products
        </h1>

        <p>
          Explore our complete collection.
        </p>

      </div>

    </section>


    <!-- TOOLBAR -->

    <section class="shop-toolbar">

      <button id="filterBtn" class="toolbar-button" type="button">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 6h16"/>
          <path d="M7 12h10"/>
          <path d="M10 18h4"/>
        </svg>

        <span>Filter</span>

      </button>


      <select id="sortSelect" class="sort-select">

        <option value="default">
          Sort: Recommended
        </option>

        <option value="newest">
          Newest
        </option>

        <option value="price-low">
          Price: Low to High
        </option>

        <option value="price-high">
          Price: High to Low
        </option>

        <option value="best">
          Best Selling
        </option>

      </select>

    </section>


    <!-- FILTER PANEL -->

    <section id="filterPanel" class="filter-panel">

      <div class="filter-heading">

        <h2>Filter Products</h2>

        <button id="closeFilter" type="button">
          ×
        </button>

      </div>


      <div class="filter-section">

        <h3>Category</h3>

        <label>
          <input
            type="radio"
            name="category"
            value="all"
            checked
          >
          <span>All Products</span>
        </label>

        <label>
          <input
            type="radio"
            name="category"
            value="watch"
          >
          <span>Watches</span>
        </label>

        <label>
          <input
            type="radio"
            name="category"
            value="chocolate"
          >
          <span>Chocolate</span>
        </label>

        <label>
          <input
            type="radio"
            name="category"
            value="book"
          >
          <span>Books</span>
        </label>

      </div>


      <button id="applyFilter" class="apply-filter" type="button">
        Apply Filter
      </button>

    </section>


    <!-- PRODUCT COUNT -->

    <div class="product-count">

      <span id="productCount">
        0 products
      </span>

    </div>


    <!-- PRODUCTS -->

    <section
      id="productGrid"
      class="product-grid"
    ></section>


    <!-- EMPTY -->

    <section
      id="noProducts"
      class="no-products"
    >

      <div class="no-products-icon">
        🔍
      </div>

      <h2>
        No products found
      </h2>

      <p>
        Try changing your filter or sorting option.
      </p>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <div class="bottom-inner">

      <a href="index.html" class="nav-item">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 10 9-7 9 7"/>
          <path d="M5 9v11h14V9"/>
          <path d="M9 20v-6h6v6"/>
        </svg>

        <span>Home</span>

      </a>


      <a href="delivery.html" class="nav-item">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7h11v10H3z"/>
          <path d="M14 10h4l3 3v4h-7z"/>
          <circle cx="7" cy="19" r="1.5"/>
          <circle cx="18" cy="19" r="1.5"/>
        </svg>

        <span>Delivery</span>

      </a>


      <a href="cart.html" class="nav-item">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="20" r="1"/>
          <circle cx="19" cy="20" r="1"/>
          <path d="M3 4h2l2.6 11.2a2 2 0 0 0 2 1.55h7.8a2 2 0 0 0 1.9-1.37L21 8H6"/>
        </svg>

        <span>Cart</span>

      </a>


      <a href="index.html" class="nav-item">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-4-4"/>
        </svg>

        <span>Search</span>

      </a>


      <a href="account.html" class="nav-item">

        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>
        </svg>

        <span>Account</span>

      </a>

    </div>

  </nav>


  <script src="shop.js"></script>

</body>
</html>
