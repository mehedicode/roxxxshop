<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Customer Support - roxxx.shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: "var(--color-bg)",
              dark: "var(--color-dark)",
              primary: "var(--color-primary)",
              hover: "var(--color-primary-hover)",
              accent: "var(--color-accent)",
              text: "var(--color-text)",
              muted: "var(--color-muted)",
              border: "var(--color-border)"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="support.css">
</head>
<body>

  <header class="bg-white border-b border-brand-border">
    <div class="container mx-auto px-4 md:px-6">
      <div class="h-[68px] md:h-[76px] flex items-center justify-between">
        <a href="index.html" class="text-[22px] md:text-[25px] font-extrabold tracking-tight text-brand-dark">
          roxxx<span class="text-brand-primary">.shop</span>
        </a>
        <a href="index.html" class="w-11 h-11 rounded-full flex items-center justify-center text-brand-dark" aria-label="Back to home">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 md:px-6 pb-10">

    <section class="support-intro">
      <div class="intro-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-1.2 1.1-1.8 1.4-1.8 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </div>
      <div>
        <h1 class="text-[23px] font-extrabold text-brand-dark">Customer Support</h1>
        <p class="mt-2 text-[13px] leading-5 text-brand-muted">
          Need help with your order? Send us a message and our team will get back to you.
        </p>
      </div>
    </section>

    <form id="supportForm" class="support-card">
      <label class="support-field">
        <span>Full Name</span>
        <input id="supportName" name="name" type="text" placeholder="Your name" autocomplete="name" required>
      </label>
      <label class="support-field">
        <span>Mobile Number</span>
        <input id="supportMobile" name="mobile" type="tel" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel" required>
      </label>
      <label class="support-field">
        <span>Subject</span>
        <select id="supportSubject" name="subject" class="support-select" required>
          <option value="" disabled selected>Select a topic</option>
          <option value="order">Order issue</option>
          <option value="delivery">Delivery problem</option>
          <option value="payment">Payment issue</option>
          <option value="return">Return / Refund</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label class="support-field">
        <span>Message</span>
        <textarea id="supportMessage" name="message" rows="4" placeholder="Describe your issue..." autocomplete="off" required></textarea>
      </label>
      <button id="supportSubmit" class="support-primary" type="submit">Send Message</button>
      <p id="supportError" class="support-error" hidden></p>
      <p id="supportSuccess" class="support-success" hidden></p>
    </form>

  </main>

  <nav class="bottom">
    <div class="bottom-inner">
      <a href="index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg>
        <span>Home</span>
      </a>
      <a href="delivery.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>
        <span>Delivery</span>
      </a>
      <a href="cart.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.6 11.2a2 2 0 0 0 2 1.55h7.8a2 2 0 0 0 1.9-1.37L21 8H6"/></svg>
        <span>Cart</span>
      </a>
      <a href="index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Search</span>
      </a>
      <a href="account.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
        <span>Account</span>
      </a>
    </div>
  </nav>

  <script src="support.js"></script>
</body>
</html>
